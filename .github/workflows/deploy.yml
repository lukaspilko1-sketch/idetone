# Kontrola, testy a build při každém push/PR. Nasazení na GitHub Pages proběhne jen z main
# a jen když je v repozitáři proměnná PAGES_DEPLOY=true
# (Settings → Secrets and variables → Actions → Variables). Návod: docs/SPRAVA.md.
name: Build a nasazení

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://lukaspilko1-sketch.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/idetone' }}
  PUBLIC_INDEXING: ${{ vars.PUBLIC_INDEXING || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Kontrola odkazů a kotev
        run: npm run links
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
        with:
          path: dist

  test:
    runs-on: ubuntu-latest
    env:
      # Testy běží proti dev serveru v kořeni
      BASE_PATH: /
      SITE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testy (navigace, formuláře, přesměrování, přístupnost, layout)
        run: npx playwright test tests/layout.spec.ts tests/forms.spec.ts tests/a11y.spec.ts

  deploy:
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
