# Úvodní stránka – sekce v pořadí, v jakém se zobrazí.
# visible: false sekci skryje. Typ sekce (type) neměnit.
# Fotky s placeholder: true jsou dočasné AI ilustrace – před spuštěním nahradit (npm run todo).
home:
  # Ceny na úvodu (sekce Modely a štítek v hero). Cena je vždy na detailu, v přehledu a ve srovnání.
  showPrices: false
  sections:
    - type: hero
      visible: true
      eyebrow: Reprosoustavy s citem pro hudbu
      # NÁVRH: ke schválení (nadpis a věta)
      title: Ručně laděné reprosoustavy z Brna
      text: Navrhuji, ladím a vyrábím dvoupásmové reprosoustavy, které nechají vyniknout hudbě i s jejím emočním nábojem.
      primary:
        label: Prohlédnout modely
        href: /reprosoustavy/
      secondary:
        label: Domluvit poslech
        href: /poslech/
      product: sara
      image:
        src: ../assets/products/sara/DSC_0800i-1.png
        alt: Pár reprosoustav Sara šikmo zezadu, dřevěné bočnice a černé podstavce
      # Pozadí za sklem: fotka (rozostřená). Video z dílny: soubory do public/video/
      # a doplnit video: /video/dilna.webm (případně videoMp4: /video/dilna.mp4), fotka zůstane jako poster.
      background:
        image:
          src: ../assets/uploads/ai/dilna-hero.png
          alt: Ilustrační foto – dílna s ponkem a dýhami
          placeholder: true
          source: AI ilustrace – nahradit

    - type: models
      visible: true
      eyebrow: Modely
      title: Dvě reprosoustavy, jeden přístup # NÁVRH: ke schválení
      products: [sara, reva]
      compareLink:
        label: Porovnat modely
        href: /reprosoustavy/#srovnani

    - type: quote
      visible: true
      text: Reprosoustava je složitý celek, ve kterém se protínají nejen čistě technické, ale i emoční a estetické aspekty.
      author: Petr Kocourek
      link:
        label: O ideTone
        href: /o-idetone/
      image:
        src: ../assets/uploads/ai/hudba-gramofon.png
        alt: Ilustrační foto – přenoska gramofonu na vinylové desce
        placeholder: true
        source: AI ilustrace – nahradit

    - type: technology
      visible: true
      eyebrow: Technologie
      title: Tři konstrukční řešení # NÁVRH: ke schválení
      image:
        src: ../assets/uploads/ai/dilna-vyhybka.png
        alt: Ilustrační foto – ruce pájí cívky a kondenzátory frekvenční výhybky
        placeholder: true
        source: AI ilustrace – nahradit
      # NÁVRH: ke schválení (zkrácené texty z podstránky Technologie)
      items:
        - title: Zvukovod u výškového reproduktoru
          text: Formuje vyzařování v kritickém pásmu 2000–6000 Hz. Lehkost a přirozenost bez náznaku ostrosti.
          href: /technologie/#zvukovod
        - title: Regulace výšek −1 / 0 / +1 dB
          text: U Sary otočným přepínačem vzadu, mimo přímou signálovou cestu.
          href: /technologie/#uroven-vysek
        - title: Bassreflex vyvedený dolů
          text: Méně citlivá na umístění blíže stěn, bez tendence zadunívat.
          href: /technologie/#bassreflex
      link:
        label: Jak to funguje
        href: /technologie/

    - type: listening
      visible: true
      eyebrow: Poslechové studio Brno
      # NÁVRH: ke schválení
      title: Než se rozhodnete, poslechněte si je
      text: Reprosoustavy si můžete poslechnout v poslechovém studiu v Brně. Termín domluvíme individuálně.
      button:
        label: Domluvit poslech
        href: /poslech/
      background:
        src: ../assets/uploads/ai/poslech-mistnost.png
        alt: Ilustrační foto – poslechová místnost s křeslem a gramofonem
        placeholder: true
        source: AI ilustrace – nahradit

    - type: references
      visible: false
      title: Co říkají posluchači
